<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Futuristic Navy / Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glass Rim Holographic Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Isometric Face Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>

    <!-- Core Glowing Orb -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Academic Star Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- App Icon Base: Futuristic Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="114" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="20" y="20" width="472" height="472" rx="114" fill="none" stroke="url(#rimGrad)" stroke-width="4.5" stroke-opacity="0.85" />

  <!-- Ambient Internal Lights -->
  <circle cx="150" cy="130" r="140" fill="#38bdf8" opacity="0.14" filter="url(#neonGlow)" />
  <circle cx="370" cy="370" r="140" fill="#6366f1" opacity="0.18" filter="url(#neonGlow)" />

  <!-- Subtle Blueprint Tech Matrix Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="120" y1="60" x2="120" y2="452" />
    <line x1="256" y1="60" x2="256" y2="452" />
    <line x1="392" y1="60" x2="392" y2="452" />
    <line x1="60" y1="180" x2="452" y2="180" />
    <line x1="60" y1="332" x2="452" y2="332" />
  </g>

  <!-- 3D Futuristic Isometric Sarpras Node Symbol -->
  <g transform="translate(256, 254) scale(0.92)" filter="url(#softShadow)">
    <!-- Base Glow Shadow -->
    <ellipse cx="0" cy="150" rx="135" ry="38" fill="#020617" opacity="0.6" filter="url(#neonGlow)" />

    <!-- Isometric Left Face -->
    <path d="M 0,0 L -120,-70 L -120,70 L 0,140 Z" fill="url(#leftFace)" stroke="#818cf8" stroke-width="3" stroke-linejoin="round" />

    <!-- Isometric Right Face -->
    <path d="M 0,0 L 120,-70 L 120,70 L 0,140 Z" fill="url(#rightFace)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />

    <!-- Isometric Top Face -->
    <path d="M 0,0 L -120,-70 L 0,-140 L 120,-70 Z" fill="url(#topFace)" stroke="#e0f2fe" stroke-width="3" stroke-linejoin="round" />

    <!-- High-Tech Internal Vault Layering -->
    <path d="M 0,-12 L -88,-64 L 0,-116 L 88,-64 Z" fill="#090d16" opacity="0.85" />
    
    <!-- Central Digital Energy Core (Cloud Master DB Node) -->
    <circle cx="0" cy="0" r="32" fill="url(#coreGlow)" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />

    <!-- Circuit Connection Tracks (Inventory & Asset Logistics) -->
    <path d="M 0,0 L 0,110" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="110" r="7" fill="#38bdf8" />

    <path d="M -24,-14 L -86,-50" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="-86" cy="-50" r="6" fill="#c7d2fe" />

    <path d="M 24,-14 L 86,-50" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" />
    <circle cx="86" cy="-50" r="6" fill="#e0f2fe" />

    <!-- Academic Star at Peak Vertex (Simbol Prestasi & Sekolah) -->
    <g transform="translate(0, -140)">
      <polygon points="0,-18 5.5,-5.5 19,-5.5 9,3.5 13,16 0,8 -13,16 -9,3.5 -19,-5.5 -5.5,-5.5" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="1.2" filter="url(#neonGlow)" />
    </g>
  </g>

  <!-- High-Tech Holographic Orbit Ring -->
  <ellipse cx="256" cy="256" rx="200" ry="92" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" stroke-dasharray="16 10 4 10" transform="rotate(-22 256 256)" opacity="0.75" />
  <circle cx="95" cy="202" r="5.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="415" cy="308" r="5.5" fill="#c084fc" filter="url(#neonGlow)" />
</svg>
