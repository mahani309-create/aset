<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Holographic Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Isometric Face Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Core Glowing Orb -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a5f3fc" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Academic Star Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Pure Emblem (Frameless) -->
  <circle cx="256" cy="256" r="160" fill="#38bdf8" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="256" cy="270" r="130" fill="#6366f1" opacity="0.10" filter="url(#neonGlow)" />

  <!-- High-Tech Holographic Orbit Ring (Frameless) -->
  <ellipse cx="256" cy="256" rx="226" ry="102" fill="none" stroke="url(#orbitGrad)" stroke-width="3" stroke-dasharray="16 10 4 10" transform="rotate(-22 256 256)" opacity="0.8" />
  <circle cx="75" cy="196" r="6.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="437" cy="316" r="6.5" fill="#818cf8" filter="url(#neonGlow)" />

  <!-- 3D Futuristic Isometric Sarpras Node Symbol (Enlarged, Frameless Emblem) -->
  <g transform="translate(256, 256) scale(1.22)" filter="url(#softDropShadow)">
    <!-- Base Glow Shadow -->
    <ellipse cx="0" cy="148" rx="130" ry="34" fill="#0f172a" opacity="0.25" filter="url(#neonGlow)" />

    <!-- Isometric Left Face -->
    <path d="M 0,0 L -120,-70 L -120,70 L 0,140 Z" fill="url(#leftFace)" stroke="#818cf8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Isometric Right Face -->
    <path d="M 0,0 L 120,-70 L 120,70 L 0,140 Z" fill="url(#rightFace)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Isometric Top Face -->
    <path d="M 0,0 L -120,-70 L 0,-140 L 120,-70 Z" fill="url(#topFace)" stroke="#bae6fd" stroke-width="2.5" stroke-linejoin="round" />

    <!-- High-Tech Internal Vault Layering -->
    <path d="M 0,-12 L -88,-64 L 0,-116 L 88,-64 Z" fill="#0f172a" opacity="0.8" />
    
    <!-- Central Digital Energy Core (Cloud Master DB Node) -->
    <circle cx="0" cy="0" r="32" fill="url(#coreGlow)" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />

    <!-- Circuit Connection Tracks (Inventory & Asset Logistics) -->
    <path d="M 0,0 L 0,110" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="110" r="7" fill="#38bdf8" />

    <path d="M -24,-14 L -86,-50" stroke="#818cf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="-86" cy="-50" r="6" fill="#c7d2fe" />

    <path d="M 24,-14 L 86,-50" stroke="#67e8f9" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="86" cy="-50" r="6" fill="#e0f2fe" />

    <!-- Academic Star at Peak Vertex (Simbol Prestasi & Sekolah) -->
    <g transform="translate(0, -140)">
      <polygon points="0,-18 5.5,-5.5 19,-5.5 9,3.5 13,16 0,8 -13,16 -9,3.5 -19,-5.5 -5.5,-5.5" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="1.2" filter="url(#neonGlow)" />
    </g>
  </g>
</svg>
